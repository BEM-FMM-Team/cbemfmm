[build-system]
requires = ["meson-python>=0.18", "meson", "ninja", "cython>=3", "numpy"]
build-backend = 'mesonpy'

[project]
name = "cbemfmm"
description = "C library companion to bem-fmm-python"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Shawn Pande", email = "spande@wpi.edu" },
    { name = "Guillermo Nunez Ponasso" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.4",
    "scipy",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/BEM-FMM-Team/cbemfmm"
